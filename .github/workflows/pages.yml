name: Build and deploy to Pages

on:
  push:
    branches: [claude/yacht-spinnaker-simulator-82ugrf]
  workflow_dispatch:

# 同時実行を1本に絞る。走行中のデプロイは中断しない。
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # spinnaker.html から index.html を生成し、配信する分だけ _site に集める
      - name: Build index.html
        run: |
          node build.mjs
          mkdir -p _site
          cp index.html _site/index.html

      # Pages が未設定なら有効化も試みる（権限が足りなければ手動設定が必要）
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
